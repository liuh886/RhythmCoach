name: One-time copy edit

on:
  push:
    branches:
      - agent/copy-recording-style-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/copy-recording-style-v2
          fetch-depth: 0
      - name: Update copy and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/components/ScriptEditor.tsx')
          text = path.read_text(encoding='utf-8')

          old_label = "{globalLang === 'zh' ? '录音声音' : 'Recording sound'}"
          new_label = "{globalLang === 'zh' ? '录音风格' : 'Recording style'}"
          old_note = """              <p style={{ color: 'var(--text-muted)', fontSize: '.78rem', lineHeight: 1.5, margin: '9px 2px 0' }}>
                {globalLang === 'zh' ? '音频配置在训练开始时锁定，避免练习中断或录音被拆分。' : 'The audio profile is locked when the session starts to prevent recording interruptions.'}
              </p>
"""

          if old_label not in text:
              raise SystemExit('Expected recording label not found')
          if old_note not in text:
              raise SystemExit('Expected recording note not found')

          text = text.replace(old_label, new_label, 1).replace(old_note, '', 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-copy-edit.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/components/ScriptEditor.tsx .github/workflows/one-time-copy-edit.yml
          git commit -m "copy: rename recording style label"
          git push origin HEAD:agent/copy-recording-style-v2
