name: Normalize release lock metadata

on:
  push:
    branches: ["release/v1.0.1"]

permissions:
  contents: write

jobs:
  normalize-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize package-lock metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('web/package.json', 'utf8'));
          const lockPath = 'web/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.name = pkg.name;
          lock.version = pkg.version;
          lock.packages[''].name = pkg.name;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lock metadata
        run: |
          if git diff --quiet -- web/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: synchronize package lock metadata"
          git push origin HEAD:release/v1.0.1
