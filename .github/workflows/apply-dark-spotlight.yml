name: Apply dark spotlight design

on:
  push:
    branches: ["ui/dark-spotlight-atmosphere"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout design branch
        uses: actions/checkout@v4
        with:
          ref: ui/dark-spotlight-atmosphere
      - name: Apply spotlight atmosphere
        run: |
          python3 <<'PY'
          from pathlib import Path

          index_path = Path('web/src/index.css')
          index_css = index_path.read_text()
          old_body = """body {
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--text-primary);
  background-color: var(--bg-base);
  background-image:
    radial-gradient(ellipse at 18% -12%, rgba(139, 92, 246, 0.16), transparent 47%),
    radial-gradient(ellipse at 88% 112%, rgba(56, 189, 248, 0.095), transparent 46%),
    linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
  background-size: auto, auto, 54px 54px, 54px 54px;
  background-attachment: fixed;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
"""
          new_body = """body {
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--text-primary);
  background-color: #050507;
  background-image:
    radial-gradient(ellipse 56% 40% at 50% -6%, rgba(246, 248, 255, 0.12) 0%, rgba(194, 181, 253, 0.072) 30%, rgba(96, 75, 150, 0.026) 54%, transparent 76%),
    radial-gradient(ellipse 76% 28% at 50% 106%, rgba(68, 93, 145, 0.085), transparent 74%),
    linear-gradient(rgba(255, 255, 255, 0.004) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.004) 1px, transparent 1px);
  background-size: auto, auto, 54px 54px, 54px 54px;
  background-attachment: fixed;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"PingFang SC\", \"Hiragino Sans GB\", \"Microsoft YaHei\", \"Noto Sans CJK SC\", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
"""
          if old_body not in index_css:
              raise SystemExit('Expected body background block was not found')
          index_path.write_text(index_css.replace(old_body, new_body, 1))

          theme_path = Path('web/src/components/CommercialTheme.css')
          theme_css = theme_path.read_text()
          old_shell = """.app-shell::before {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: '';
  background:
    radial-gradient(ellipse at 12% -8%, rgba(120, 96, 220, 0.12), transparent 42%),
    radial-gradient(ellipse at 92% 102%, rgba(50, 166, 214, 0.075), transparent 42%);
}
"""
          new_shell = """.app-shell::before {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  content: '';
  background:
    radial-gradient(ellipse 42% 22% at 50% 2%, rgba(247, 249, 255, 0.15), rgba(196, 181, 253, 0.06) 34%, transparent 72%),
    conic-gradient(from 145deg at 50% -10%, transparent 0deg 8deg, rgba(216, 224, 255, 0.015) 15deg, rgba(167, 139, 250, 0.05) 34deg, rgba(94, 201, 255, 0.018) 52deg, transparent 62deg 360deg),
    radial-gradient(ellipse 70% 24% at 50% 86%, rgba(72, 98, 157, 0.07), transparent 74%);
  opacity: 0.94;
}

html:not([data-theme='light']) .app-shell::after {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  content: '';
  background:
    radial-gradient(ellipse 60% 44% at 50% 34%, transparent 0%, rgba(0, 0, 0, 0.035) 54%, rgba(0, 0, 0, 0.34) 100%),
    linear-gradient(90deg, rgba(0, 0, 0, 0.22), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.22));
}
"""
          if old_shell not in theme_css:
              raise SystemExit('Expected app shell atmosphere block was not found')
          theme_path.write_text(theme_css.replace(old_shell, new_shell, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          old_unreleased = "## [Unreleased]\n\n"
          new_unreleased = "## [Unreleased]\n\n### Changed\n\n- Refresh the dark-theme background with a centered stage spotlight, soft light cone, floor glow, and restrained edge vignette while leaving the light theme unchanged.\n\n"
          if old_unreleased not in changelog:
              raise SystemExit('Expected Unreleased heading was not found')
          changelog_path.write_text(changelog.replace(old_unreleased, new_unreleased, 1))
          PY
      - name: Commit design update
        run: |
          if git diff --quiet -- web/src/index.css web/src/components/CommercialTheme.css CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/index.css web/src/components/CommercialTheme.css CHANGELOG.md
          git commit -m "ui: add dark spotlight atmosphere"
          git push origin HEAD:ui/dark-spotlight-atmosphere
