<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RhythmCoach" />
    <meta
      name="description"
      content="RhythmCoach helps speakers and podcasters rehearse with outlines, prompting, recording, and explainable pacing feedback before the real take."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RhythmCoach · Rehearse before you record" />
    <meta
      property="og:description"
      content="Prepare the script, rehearse the delivery, and review pacing before the real recording."
    />
    <meta property="og:url" content="https://liuh886.github.io/RhythmCoach/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RhythmCoach · Rehearse before you record" />
    <meta
      name="twitter:description"
      content="Prepare the script, rehearse the delivery, and review pacing before the real recording."
    />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('rhythmcoach_theme_v1') === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#f4f5f8' : '#08080b');
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();

      window.addEventListener('load', () => {
        const section = new URLSearchParams(window.location.search).get('section');
        const targetId = section === 'workflow'
          ? 'landing-workflow'
          : section === 'feedback'
            ? 'landing-feedback'
            : null;
        if (!targetId) return;

        let attempts = 0;
        const scrollWhenReady = () => {
          const target = document.getElementById(targetId);
          if (target) {
            target.scrollIntoView({ block: 'start' });
            return;
          }
          attempts += 1;
          if (attempts < 90) window.requestAnimationFrame(scrollWhenReady);
        };
        window.requestAnimationFrame(scrollWhenReady);
      });
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./rhythmcoach.svg" />
    <link rel="apple-touch-icon" href="./rhythmcoach.svg" />

    <!-- Supabase browser SDK. The publishable key remains in application config; privileged keys never enter the bundle. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-G4TTH49G1C');
    </script>

    <title>RhythmCoach · Rehearse before you record</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
